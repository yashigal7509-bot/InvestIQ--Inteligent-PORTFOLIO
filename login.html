{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block heading %}Sign In{% endblock %}
{% block content %}
<div class="center"><form class="card form-card" method="post" action="{{ url_for('login') }}">
  <h2>Welcome back</h2>
  <p class="muted">Log in to review your allocation and portfolio.</p>
  <label>E-mail address<input type="email" name="email" required placeholder="you@example.com"></label>
  <label>Password<input type="password" name="password" required placeholder="Your password"></label>
  <button class="btn wide" type="submit">Sign in</button>
  <p class="muted small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</form></div>
{% endblock %}
